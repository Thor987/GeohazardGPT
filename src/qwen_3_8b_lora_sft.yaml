# Model
model_name_or_path: path/to/Qwen3-8B
trust_remote_code: true

# Fine-tuning method
stage: sft
do_train: true
finetuning_type: lora
# finetuning_type: freeze
# freeze_trainable_modules: all
lora_rank: 128                 # LoRA capacity for domain adaptation
lora_alpha: 256                # Scaling factor; two times the rank
lora_target: all
lora_dropout: 0.05             # Regularization against overfitting

# Dataset
dataset: final_data             # Domain data plus the general instruction mixture
template: qwen3
enable_thinking: false
cutoff_len: 2048               # Maximum sequence length used for SFT
preprocessing_num_workers: 16
dataloader_num_workers: 4

# Output and logging
output_dir: /path/to/qwen3_8b_lora/
logging_steps: 10
save_steps: 300
plot_loss: true
save_only_model: false
overwrite_output_dir: true

# Optimization
per_device_train_batch_size: 6
gradient_accumulation_steps: 8  # Effective batch size is 48 per process
learning_rate: 2e-4
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000

# Validation
val_size: 0.01
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 300
